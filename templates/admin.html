<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መላ SACCO - Admin Dynamic Panel</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="admin-container">
        <h2>መላ SACCO - የአድሚን ፓነል 🛡️</h2>

        <div class="role-bar card">
            <label><strong>የአድሚን ክፍል ይምረጡ:</strong></label>
            <select id="adminRole" onchange="switchAdminPanel(this.value)">
                <option value="GM">GM (ዋና ስራ አስኪያጅ)</option>
                <option value="LOAN_APPROVER">የብድር ፈቃድ እና ሰነድ አጣሪ</option>
                <option value="LOAN_MANAGER">የብድር ተቆጣጣሪ</option>
                <option value="FINANCE">የገንዘብ ሰበሳቢ</option>
            </select>
        </div>

        <!-- 1. የቀረቡ ተመዝጋቢዎችን በቅጽበት የሚያሳይ ቴብል -->
        <section id="panelApprover" class="card">
            <h3>📂 የተመዝጋቢዎች እና የሰነዶች መቆጣጠሪያ (Live Data)</h3>
            <table>
                <thead>
                    <tr>
                        <th>መዝገብ ID</th>
                        <th>ስም</th>
                        <th>ስልክ</th>
                        <th>ሁኔታ</th>
                        <th>እርምጃ</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- አውቶማቲክ እዚህ ይሞላል -->
                </tbody>
            </table>
        </section>

        <!-- 2. የአድሚን ለሌሎች አድሚኖች/ተጠቃሚዎች መልእክት መላኪያ -->
        <section class="card">
            <h3>💬 የአድሚኖች እና ተጠቃሚዎች የውስጥ መልእክት ልውውጥ</h3>
            <input type="number" id="targetTgId" placeholder="የተቀባዩ Telegram ID (የአድሚን ወይም የተመዝጋቢ)">
            <div class="chat-box" id="chatHistoryBox" style="max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; margin: 10px 0;">
                <p><em>የተቀባዩን Telegram ID ሲያስገቡ የቆዩ መልእክቶች እዚህ ይታያሉ።</em></p>
            </div>
            <textarea id="msgContent" placeholder="መልእክትዎን ይጻፉ..."></textarea>
            <button onclick="sendInternalMsg()" class="btn">መልእክት ላክ</button>
        </section>
    </div>

    <script>
        // በየ 3 ሰከንዱ አዲስ መረጃ አውቶማቲክ ማምጫ (Live Sync)
        setInterval(fetchUsers, 3000);

        async function fetchUsers() {
            const res = await fetch('/api/admin/get-all-users');
            const data = await res.json();
            if (data.status === 'success') {
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';
                data.users.forEach(u => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.reg_id}</td>
                            <td>${u.full_name}</td>
                            <td>${u.phone}</td>
                            <td><span class="badge">${u.status}</span></td>
                            <td>
                                <button onclick="updateStatus(${u.telegram_id}, 'Approved')" class="btn-sm">Approve</button>
                                <button onclick="updateStatus(${u.telegram_id}, 'Rejected')" class="btn-sm btn-block">Reject</button>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        async function updateStatus(tgId, status) {
            const res = await fetch('/api/admin/approve', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({telegram_id: tgId, status: status})
            });
            const data = await res.json();
            alert(data.message);
            fetchUsers();
        }

        async function sendInternalMsg() {
            const role = document.getElementById('adminRole').value;
            const targetId = document.getElementById('targetTgId').value;
            const msg = document.getElementById('msgContent').value;

            if(!targetId || !msg) return alert("እባክዎን የተቀባይ ID እና መልእክት ያስገቡ");

            const res = await fetch('/api/admin/send-internal-msg', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sender_role: role,
                    target_id: targetId,
                    message: msg
                })
            });
            const data = await res.json();
            alert(data.message);
            document.getElementById('msgContent').value = '';
        }

        fetchUsers();
    </script>
</body>
</html>
