<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መላ SACCO - Admin Panel</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="theme-dark">
    <div class="admin-container">
        <h2>መላ SACCO - የአድሚን ፓነል 🛡️</h2>
        
        <!-- Role Selector (For Simulation) -->
        <div class="role-bar">
            <label>የአድሚን ሚና ይምረጡ:</label>
            <select id="adminRole">
                <option value="GM">GM (ዋና ስራ አስኪያጅ - ሙሉ ቁጥጥር)</option>
                <option value="LOAN_APPROVER">የብድር ፈቃዲ (Loan Approver)</option>
                <option value="LOAN_MANAGER">የብድር ተቆጣጣሪ (Loan Manager)</option>
                <option value="FINANCE">የቀን ውሎ ተቆጣጣሪ (Finance)</option>
            </select>
        </div>

        <!-- Section 1: User Verification (Approver / GM) -->
        <section class="card admin-section">
            <h3>1. የተመዝጋቢዎች ማረጋገጫ (Verification)</h3>
            <table>
                <thead>
                    <tr>
                        <th>መዝገብ ID</th>
                        <th>ስም</th>
                        <th>ስልክ</th>
                        <th>ሰነድ</th>
                        <th>እርምጃ</th>
                    </tr>
                </thead>
                <tbody id="userTable">
                    <tr>
                        <td>MS-88392</td>
                        <td>አበበ ከበደ</td>
                        <td>0911223344</td>
                        <td><a href="#">ፎቶ ይመልከቱ</a></td>
                        <td>
                            <button onclick="updateStatus(123456, 'Approved')" class="btn-approve">Approve</button>
                            <button onclick="updateStatus(123456, 'Blocked')" class="btn-block">Block</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Section 2: Loan Setup (Loan Manager) -->
        <section class="card admin-section">
            <h3>2. የብድር እና የወለድ መደቢያ</h3>
            <form id="loanForm" onsubmit="setLoan(event)">
                <input type="number" id="targetTgId" placeholder="የተጠቃሚው Telegram ID" required>
                <input type="number" id="loanAmt" placeholder="የብድር መጠን (ETB)" required>
                <input type="number" id="interestRate" placeholder="የወለድ መጠን (%)" required>
                <input type="number" id="loanDays" placeholder="የመክፈያ ቀናት ብዛት" required>
                <button type="submit" class="btn">ብድር ፈቅድ</button>
            </form>
        </section>

        <!-- Section 3: Admin to Admin Communication / Internal Chat -->
        <section class="card admin-section">
            <h3>3. የውስጥ አድሚኖች መነጋገሪያ (Admin Chat)</h3>
            <div class="chat-box" id="chatBox">
                <p><strong>[GM]:</strong> የዛሬውን የብድር ክፍያ ሪፖርት አዘጋጁ።</p>
            </div>
            <input type="text" id="chatMsg" placeholder="መልእክት ይፃፉ...">
            <button class="btn">ላክ</button>
        </section>
    </div>

    <script>
        async function updateStatus(tgId, status) {
            const res = await fetch('/api/admin/approve', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({telegram_id: tgId, status: status})
            });
            const data = await res.json();
            alert(data.message);
        }

        async function setLoan(e) {
            e.preventDefault();
            const data = {
                telegram_id: document.getElementById('targetTgId').value,
                amount: document.getElementById('loanAmt').value,
                interest: document.getElementById('interestRate').value,
                days: document.getElementById('loanDays').value
            };
            const res = await fetch('/api/admin/set-loan', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
        }
    </script>
</body>
</html>
