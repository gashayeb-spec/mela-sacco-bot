<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መላ ሳኮ | Mela SACCO Membership</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-color: #0d5c3a;
            --secondary-color: #e6a100;
            --dark-color: #1f2937;
            --light-bg: #f3f4f6;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { line-height: 1.6; color: var(--dark-color); background-color: var(--light-bg); }

        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 1rem 5%;
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo { font-size: 1.4rem; font-weight: bold; color: var(--secondary-color); }
        .lang-btn {
            background-color: var(--secondary-color); color: var(--dark-color);
            border: none; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-weight: bold;
        }

        .container { max-width: 800px; margin: 20px auto; padding: 20px; }
        .card { background: var(--white); padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h2 { color: var(--primary-color); margin-bottom: 15px; border-bottom: 2px solid var(--secondary-color); padding-bottom: 5px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem;
        }

        .file-note { font-size: 0.8rem; color: #666; margin-top: 2px; }

        .submit-btn {
            background-color: var(--primary-color); color: var(--white);
            border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1.1rem; font-weight: bold;
        }
        .submit-btn:hover { background-color: #094229; }
    </style>
</head>
<body>

    <header>
        <div class="logo">መላ ሳኮ SACCO</div>
        <button class="lang-btn" id="lang-toggle" onclick="toggleLanguage()">EN</button>
    </header>

    <div class="container">
        <div class="card">
            <h2 id="form-title">የአባልነት ማመልከቻ ቅጽ</h2>
            <form id="membership-form" onsubmit="handleFormSubmit(event)">
                
                <!-- መታወቂያ መረጃ -->
                <div class="form-group">
                    <label id="lbl-fullname">ሙሉ ስም *</label>
                    <input type="text" id="fullname" required>
                </div>

                <div class="form-group">
                    <label id="lbl-phone">ስልክ ቁጥር *</label>
                    <input type="tel" id="phone" placeholder="09..." required>
                </div>

                <div class="form-group">
                    <label id="lbl-tin">የቲን ቁጥር (TIN Number) *</label>
                    <input type="text" id="tin-number" required>
                </div>

                <!-- የንግድና የቫት ሁኔታ -->
                <div class="form-group">
                    <label id="lbl-vat-status">የ VAT ተመዝጋቢ ነዎት? *</label>
                    <select id="vat-status" onchange="toggleVatInput()">
                        <option value="no">አይደለሁም / አልተመዘገብኩም (-)</option>
                        <option value="yes">አዎ ተመዝግቤአለሁ</option>
                    </select>
                </div>

                <div class="form-group" id="vat-number-group" style="display: none;">
                    <label id="lbl-vat-num">የ VAT ምዝገባ ቁጥር</label>
                    <input type="text" id="vat-number" placeholder="የቫት ቁጥር ያስገቡ">
                </div>

                <!-- የሰነድ ማያያዣዎች -->
                <div class="form-group">
                    <label id="lbl-doc-license">የንግድ ፈቃድ (Business License) *</label>
                    <input type="file" id="doc-license" accept="image/*" required>
                    <div class="file-note">ፎቶ ወይም ስካን የተደረገ ሰነድ ያስገቡ</div>
                </div>

                <div class="form-group">
                    <label id="lbl-doc-id">የታደሰ መታወቂያ / ፓስፖርት *</label>
                    <input type="file" id="doc-id" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label id="lbl-doc-photo">የፓስፖርት መጠን ፎቶ *</label>
                    <input type="file" id="doc-photo" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label id="lbl-doc-edu">የትምህርት ማስረጃ (አማራጭ)</label>
                    <input type="file" id="doc-edu" accept="image/*">
                </div>

                <button type="submit" class="submit-btn" id="btn-submit">ማመልከቻውን ላክ</button>
            </form>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        let currentLang = 'am';

        function toggleVatInput() {
            const vatStatus = document.getElementById('vat-status').value;
            const vatGroup = document.getElementById('vat-number-group');
            vatGroup.style.display = vatStatus === 'yes' ? 'block' : 'none';
        }

        // ፋይልን ወደ Base64 string መቀየሪያ ፋንክሽን
        const fileToBase64 = file => new Promise((resolve, reject) => {
            if (!file) return resolve(null);
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        async function handleFormSubmit(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('btn-submit');
            submitBtn.innerText = "እየተላከ ነው...";
            submitBtn.disabled = true;

            try {
                const licenseFile = document.getElementById('doc-license').files[0];
                const idFile = document.getElementById('doc-id').files[0];
                const photoFile = document.getElementById('doc-photo').files[0];
                const eduFile = document.getElementById('doc-edu').files[0];

                const formData = {
                    fullName: document.getElementById('fullname').value,
                    phone: document.getElementById('phone').value,
                    tinNumber: document.getElementById('tin-number').value,
                    vatStatus: document.getElementById('vat-status').value,
                    vatNumber: document.getElementById('vat-number').value || "-",
                    licenseDoc: await fileToBase64(licenseFile),
                    idDoc: await fileToBase64(idFile),
                    photoDoc: await fileToBase64(photoFile),
                    eduDoc: await fileToBase64(eduFile),
                    language: currentLang
                };

                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify(formData));
                } else {
                    alert("ማመልከቻዎ በስኬት ተልኳል!");
                }
            } catch (err) {
                alert("ፋይሎችን በማዘጋጀት ላይ ስህተት ተፈጽሟል። እባክዎ ድጋሚ ይሞክሩ።");
                submitBtn.disabled = false;
                submitBtn.innerText = "ማመልከቻውን ላክ";
            }
        }
    </script>
</body>
</html>
